<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Likes</title>
<!-- Same warm-up the generated digest pages get: start the YouTube API
     fetch during parse instead of leaving it to assets/player.js at the end
     of the body. player.js detects an in-flight request and does not add a
     second one. -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://s.ytimg.com">
<link rel="preconnect" href="https://i.ytimg.com">
<script src="https://www.youtube.com/iframe_api" async></script>
<!-- Loaded BEFORE this page's own <style> on purpose: the player sheet
     also defines body/.wrap/.rec/h1/h2, and this page's rules should win
     on those. What it uniquely provides -- .bar, .ppbtn, .trow, .tracks,
     #nowbar -- has no counterpart here, so it applies cleanly. -->
<link rel="stylesheet" href="assets/player.css">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 80px;
  background: #0e0e10; color: #e8e8ea;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 760px; margin: 0 auto; }
.topnav, .storenav { margin: 0 0 18px; display: flex; gap: 8px; flex-wrap: wrap; }
.topnav a, .storenav a {
  color: #8a8a92; text-decoration: none; font-size: 13px;
  border: 1px solid #26262b; border-radius: 6px; padding: 6px 11px;
  display: inline-block;
}
.topnav a:hover, .storenav a:hover { color: #e8e8ea; border-color: #3a3a44; }
/* Jump links to each store's section, filled in by render(). */
.storenav { margin: 0; }
.storenav:empty { display: none; }
.storenav a { font-size: 12.5px; padding: 4px 9px; }
.storenav .n { color: #5f5f68; margin-left: 3px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: #8a8a92; font-size: 13px; margin: 0 0 12px; }
/* Expand / collapse everything at once; shown once there are likes. */
.tools { display: flex; gap: 8px; margin: 14px 0 10px; }
.tools[hidden] { display: none; }
.tools button {
  background: transparent; color: #8a8a92; font-family: inherit; font-size: 12.5px;
  border: 1px solid #26262b; border-radius: 6px; padding: 4px 9px; cursor: pointer;
}
.tools button:hover { color: #e8e8ea; border-color: #3a3a44; }
/* Every store, and every availability tier inside it, is a <details> that
   starts closed: the summary lines say enough (counts per tier) to pick
   which one to open. */
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; flex: none; width: 0; height: 0; margin-right: 2px;
  border-left: 5px solid currentColor; border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; opacity: .7; transition: transform .15s;
}
details[open] > summary::before { transform: rotate(90deg); }
details.store { border-bottom: 1px solid #26262b; }
details.store > summary {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px;
  padding: 15px 0 13px; color: #8a8a92;
}
details.store > summary .sname {
  font-size: 15px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: #c8c8ce;
}
details.store > summary:hover .sname { color: #e8e8ea; }
.scount { color: #5f5f68; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-left: auto; }
.chip {
  font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9px;
  background: #202027; color: #9a9aa2;
}
.chip.t-in_stock { background: #12261a; color: #6fcf8e; }
.chip.t-preorder { background: #2b2210; color: #e0af52; }
.chip.t-out_of_stock { background: #2b1414; color: #e08a8a; }
.chip.t-gone { background: #3a1616; color: #ff8c8c; }
/* On a phone the counts get a line of their own, under the store's name,
   rather than landing right- or left-aligned depending on how many. */
@media (max-width: 560px) {
  .chips { margin-left: 0; width: 100%; padding-left: 15px; }
}
.storebody { padding: 0 0 12px; }
details.tier > summary {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: #8a8a92; padding: 9px 0 7px 14px;
}
details.tier > summary:hover { color: #c8c8ce; }
details.tier.t-in_stock > summary { color: #6fcf8e; }
details.tier > summary .n { color: #5f5f68; font-weight: 400; }
details.tier > .tiernote, details.tier > .rec { margin-left: 14px; }
.tiernote { color: #6f6f78; font-size: 12.5px; margin: 0 0 4px; }
/* Where a like came from: the mail it was liked in. */
.rec .src { color: #6f6f78; font-size: 12px; margin: -2px 0 6px; }
.badge.instock { background: #12261a; color: #6fcf8e; }
.badge.gone { background: #3a1616; color: #ff8c8c; }
.was { color: #6f6f78; font-size: 12px; }
/* Gone: still listed so you decide, but visibly not buyable. The meta row
   stays at full strength so Unlike is as easy to reach as ever. */
.rec.gone > img, .rec.gone .body > :not(.meta) { opacity: .5; }
.rec {
  display: flex; gap: 14px; padding: 14px 0;
  border-bottom: 1px solid #1c1c21;
}
.rec img {
  width: 60px; height: 60px; border-radius: 5px;
  background: #26262b; flex: none; object-fit: cover;
}
.rec .body { min-width: 0; flex: 1; }
.rec .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.rec .title a { color: #e8e8ea; text-decoration: none; }
.rec .title a:hover { color: #6ea8ff; }
.meta { color: #8a8a92; font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 10px;
  background: #202027; color: #9a9aa2;
}
a.buy { color: #6ea8ff; text-decoration: none; font-size: 12.5px; margin-left: auto; }
a.buy:hover { text-decoration: underline; }
button.unlike {
  flex: none; background: transparent; border: 1px solid #3a2020; color: #e05a5a;
  border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  font-family: inherit;
}
button.unlike:hover { background: #2a1414; }
/* .fineprint and ol.tracklist come from player.css; here they follow the
   meta row directly rather than a tags line, so they need their own gap. */
.rec .fineprint { margin-top: 5px; }
.rec ol.tracklist { margin: 9px 0 11px; }
.rec .meta + ul.tracks, .rec .fineprint + ul.tracks { margin-top: 10px; }
.none { color: #5f5f68; font-size: 13px; }
.connect-hint {
  margin-top: 16px; padding: 11px 13px; border-radius: 7px; font-size: 13px;
  background: #16232e; border: 1px solid #234a66; color: #8fc4ee; display: none;
}
.connect-hint.show { display: block; }
.connect-hint a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="index.html">&larr; Back to digest</a>
    <a href="settings.html">&#9881; Settings</a>
  </div>
  <h1>Likes</h1>
  <p class="sub" id="sub">Everything you've liked, per store, what's in stock first. Synced across your devices via this site's repo, not this browser.</p>
  <div id="storenav" class="storenav"></div>
  <div id="connectHint" class="connect-hint">
    Not connected -- you can see likes here, but unliking needs a token.
    <a href="settings.html">Connect on Settings</a> to manage them from this device too.
  </div>
  <div id="tools" class="tools" hidden>
    <button type="button" data-open="1">Expand all</button>
    <button type="button" data-open="0">Collapse all</button>
  </div>
  <div id="content"><p class="none">Loading&hellip;</p></div>
</div>
<script>window.DIGEST_BASE_URL = "";</script>
<script src="assets/likes.js"></script>
<!-- Same player the digest pages use, written fresh by every run. It
     installs its own transport if the page lacks one, so nothing else is
     needed here, and its click/key handlers are delegated on document --
     which is why rows rendered later, after the likes fetch, still work. -->
<script src="assets/player.js"></script>
<script>
(function () {
  "use strict";
  var content = document.getElementById("content");
  var hint = document.getElementById("connectHint");

  function e(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  // Availability comes from likes_status.json, written by every daily run
  // (refresh_likes_status in the script); likes.json itself is only ever
  // written from the browser. A like the run hasn't checked yet -- liked
  // since, or its shop couldn't be reached -- has no entry and lands in
  // "Not checked yet" rather than being guessed at.
  var TIERS = [
    ["in_stock", "In stock", ""],
    ["preorder", "Pre-order", "Orderable now, not on the shelf yet."],
    ["unknown", "Not checked yet", "Liked after the last daily check, or the shop couldn't be reached."],
    ["out_of_stock", "Out of stock", "Still listed by the shop, but it can't be ordered right now."],
    ["gone", "Gone", "Sold or taken down. Left here for you to decide: Unlike removes it."],
  ];
  var DAY = 864e5;

  function shortDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  // The status badge, plus "as of <date>" when the last successful check
  // is older than a day and a half: a shop that blocks the runner leaves
  // the previous answer standing, and that shouldn't pass for today's.
  function statusBadge(st) {
    if (!st) return "";
    var text, cls;
    if (st.status === "in_stock") {
      var back = st.prev && st.prev !== "in_stock" && Date.now() - new Date(st.since) < 7 * DAY;
      text = back ? "Back in stock" : "In stock";
      cls = "instock";
    } else if (st.status === "preorder") {
      text = st.note || "Pre-order"; cls = "preorder";
    } else if (st.status === "out_of_stock") {
      text = st.note || "Out of stock"; cls = "outofstock";
    } else if (st.status === "gone") {
      text = "Gone" + (st.note ? " · " + st.note : ""); cls = "gone";
      // Only when a check saw it change: on the very first check `since`
      // is just the day checking started, not when it sold.
      if (st.prev && st.since) text += " since " + shortDate(st.since);
    } else {
      return "";
    }
    if (st.checked && Date.now() - new Date(st.checked) > 1.5 * DAY) {
      text += " · as of " + shortDate(st.checked);
    }
    var title = st.checked ? "Last checked " + new Date(st.checked).toLocaleString("en-GB") : "";
    return '<span class="badge ' + cls + '" title="' + e(title) + '">' + e(text) + '</span>';
  }

  // Which <details> are open, by data-key. Read back before every render,
  // so an Unlike (which renders the page again) keeps open what you opened;
  // empty on the first render, so every visit starts with everything closed.
  function openKeys() {
    var keys = {};
    Array.prototype.forEach.call(content.querySelectorAll("details[open]"), function (d) {
      keys[d.getAttribute("data-key")] = true;
    });
    return keys;
  }

  // An id per store from its name, so a link to one keeps working when a
  // store is added or emptied (an index would shift).
  function storeId(store, used) {
    var base = "store-" + (String(store).toLowerCase().normalize("NFKD")
      .replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || "other");
    var id = base, n = 2;
    while (used[id]) id = base + "-" + n++;
    used[id] = true;
    return id;
  }

  function render(likes, status) {
    var items = (status && status.items) || {};
    var entries = Object.keys(likes).map(function (url) {
      return Object.assign({ url: url }, likes[url]);
    });
    var storenav = document.getElementById("storenav");
    var tools = document.getElementById("tools");
    if (!entries.length) {
      storenav.innerHTML = "";
      tools.hidden = true;
      content.innerHTML = '<p class="none">No likes yet. Tap the heart on a record in the digest to save it here.</p>';
      return;
    }
    entries.sort(function (a, b) { return (b.liked_at || "").localeCompare(a.liked_at || ""); });

    // One section per store -- that's one order and one shipping bill --
    // with the tiers inside it, newest like first within each. Grouping by
    // tier first put a store under every tier it had likes in, so the same
    // shop turned up two or three times down the page.
    var stores = [], byStore = {}, tierTotals = {};
    entries.forEach(function (it) {
      var st = items[it.url];
      var tier = st && TIERS.some(function (t) { return t[0] === st.status; }) ? st.status : "unknown";
      var store = it.store || "Other";
      if (!byStore[store]) {
        byStore[store] = { n: 0, tiers: {} };
        stores.push(store);
      }
      byStore[store].n++;
      (byStore[store].tiers[tier] = byStore[store].tiers[tier] || []).push(it);
      tierTotals[tier] = (tierTotals[tier] || 0) + 1;
    });
    stores.sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: "base" }); });

    var summary = TIERS.filter(function (t) { return tierTotals[t[0]]; }).map(function (t) {
      return tierTotals[t[0]] + " " + e(t[1].toLowerCase());
    }).join(" &middot; ");
    if (status && status.updated) {
      summary += " &middot; checked " + e(shortDate(status.updated) + ", " +
        new Date(status.updated).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
    }
    document.getElementById("sub").innerHTML = summary;

    var open = openKeys(), used = {}, ids = {};
    stores.forEach(function (store) { ids[store] = storeId(store, used); });
    storenav.innerHTML = stores.map(function (store) {
      return '<a href="#' + ids[store] + '">' + e(store) + '<span class="n">' + byStore[store].n + '</span></a>';
    }).join("");
    tools.hidden = false;

    // Closed, a store is one line: its name, how many, and how many of
    // those per tier -- enough to see where something can be ordered
    // without opening anything. The tiers inside start closed too.
    var html = "";
    stores.forEach(function (store) {
      var group = byStore[store];
      var present = TIERS.filter(function (t) { return group.tiers[t[0]]; });
      var chips = present.map(function (t) {
        return '<span class="chip t-' + t[0] + '">' + group.tiers[t[0]].length + " " +
          e(t[1].toLowerCase()) + '</span>';
      }).join("");
      var skey = "s:" + store;
      html += '<details class="store" id="' + ids[store] + '" data-key="' + e(skey) + '"' +
        (open[skey] ? " open" : "") + '><summary><span class="sname">' + e(store) + '</span>' +
        '<span class="scount">' + group.n + '</span><span class="chips">' + chips + '</span>' +
        '</summary><div class="storebody">';
      present.forEach(function (tier) {
        var tierItems = group.tiers[tier[0]];
        var tkey = "t:" + store + "|" + tier[0];
        html += '<details class="tier t-' + tier[0] + '" data-key="' + e(tkey) + '"' +
          (open[tkey] ? " open" : "") + '><summary><span>' + e(tier[1]) + '</span>' +
          '<span class="n">' + tierItems.length + '</span></summary>';
        // What a tier means, inside each one: with every store closed,
        // there is no longer one place on the page everybody passes.
        if (tier[2]) html += '<p class="tiernote">' + e(tier[2]) + '</p>';
        tierItems.forEach(function (it) { html += recHtml(it, items[it.url]); });
        html += '</details>';
      });
      html += '</div></details>';
    });
    content.innerHTML = html;
  }

  function isoDay(d) {
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
  }

  // Where a like came from. So far that is always a heart tapped on a
  // digest page -- the web version of that day's mail -- and the like keeps
  // that mail's date (likes from before it was stored got theirs from the
  // archive pages in git history). The day you liked it as well, when that
  // was later than the mail.
  function sourceHtml(it) {
    var src = it.source || {};
    var liked = it.liked_at ? new Date(it.liked_at) : null;
    if (liked && isNaN(liked)) liked = null;
    var mail = "a digest mail";
    if (src.date) {
      var day = new Date(src.date + "T12:00:00Z");
      var opts = { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" };
      if (day.getUTCFullYear() !== new Date().getFullYear()) opts.year = "numeric";
      if (!isNaN(day)) mail = "the mail of " + day.toLocaleDateString("en-GB", opts);
    }
    var later = liked && (!src.date || isoDay(liked) > src.date);
    var text = "Liked " + (later ? shortDate(it.liked_at) + " " : "") + "from " + mail;
    var title = liked ? "You tapped the heart on " + liked.toLocaleString("en-GB", {
      weekday: "short", day: "numeric", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    }) : "";
    return '<div class="src"' + (title ? ' title="' + e(title) + '"' : "") + '>' + e(text) + '</div>';
  }

  function recHtml(it, st) {
    var thumb = it.thumb ? '<img src="' + e(it.thumb) + '" alt="" loading="lazy">' : '<img alt="">';
    var badges = (it.formats || []).map(function (f) {
      return '<span class="badge">' + e(f) + '</span>';
    }).join("");
    // Today's price when the daily check found one, else the price on
    // the day you liked it; the old one alongside when it changed.
    var price = (st && st.price) || it.price;
    if (price) {
      var was = st && st.price && it.price && /\d/.test(it.price) && it.price !== st.price
        ? ' <span class="was">(was ' + e(it.price) + ')</span>' : "";
      badges = '<span class="badge">' + e(price) + '</span>' + was + badges;
    }
    badges = statusBadge(st) + badges;

    // Have/Want and the tracklist, same markup as the digest so
    // player.css styles them. Discogs releases only; likes saved before
    // this shipped were filled in once from Discogs.
    var counts = [["have", "Have"], ["want", "Want"]].filter(function (kv) {
      return typeof it[kv[0]] === "number";
    }).map(function (kv) {
      return kv[1] + " " + it[kv[0]].toLocaleString("en-US");
    });
    var fine = counts.length
      ? '<div class="fineprint"><span class="community">' + e(counts.join(" · ")) + '</span></div>'
      : "";
    var tracklist = "";
    if ((it.tracklist || []).length) {
      tracklist = '<ol class="tracklist" aria-label="Tracklist">' +
        it.tracklist.map(function (t) {
          var name = t.artist ? e(t.artist) + " &ndash; " + e(t.title) : e(t.title);
          return '<li><span class="pos">' + e(t.pos || "") + '</span>' +
            '<span class="tt">' + name + '</span>' +
            '<span class="tdur">' + e(t.dur || "") + '</span></li>';
        }).join("") + '</ol>';
    }

    // Playable bars, built by the shared player so they behave exactly
    // as they do in the digest. Likes saved before this shipped have no
    // videos stored, so they simply render without a tracklist rather
    // than breaking the row -- they'll gain one if re-liked later.
    var tracks = "";
    var vids = (it.videos || []).filter(function (v) { return v && (v.yt || v.src); });
    if (vids.length && window.DigestPlayer) {
      tracks = '<ul class="tracks">' +
        vids.map(function (v) { return window.DigestPlayer.trackRowHtml(v); }).join("") +
        '</ul>';
    }

    return '<div class="rec' + (st && st.status === "gone" ? " gone" : "") + '">' +
      thumb + '<div class="body">' +
      '<div class="title"><a href="' + e(it.url) + '" target="_blank" rel="noopener noreferrer">' +
      e(it.description || it.url) + '</a></div>' + sourceHtml(it) +
      '<div class="meta">' + badges +
      '<a class="buy" href="' + e(it.url) + '" target="_blank" rel="noopener noreferrer">Open &rarr;</a>' +
      '<button class="unlike" data-url="' + e(it.url) + '" type="button">Unlike</button>' +
      '</div>' + fine + tracklist + tracks + '</div></div>';
  }

  // Public file straight off Pages, like likes.json. Missing (before the
  // first run that writes it) just means everything is "Not checked yet".
  function fetchStatus() {
    return fetch("likes_status.json", { cache: "no-store" })
      .then(function (res) { return res.ok ? res.json() : {}; })
      .catch(function () { return {}; });
  }

  // A link straight to a store (likes.html#store-...) opens it.
  function openFromHash() {
    var id = decodeURIComponent(location.hash.slice(1));
    var el = id ? document.getElementById(id) : null;
    if (el && el.tagName === "DETAILS") el.open = true;
    return el;
  }

  var firstLoad = true;
  function load() {
    Promise.all([DigestLikes.fetchLikes(), fetchStatus()]).then(function (both) {
      render(both[0], both[1]);
      if (firstLoad) {
        firstLoad = false;
        var el = openFromHash();
        if (el) el.scrollIntoView();
      }
    });
  }

  window.addEventListener("hashchange", openFromHash);

  // The jump links at the top open the store they jump to; the browser
  // then scrolls there as usual.
  document.getElementById("storenav").addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    var el = a ? document.getElementById(a.getAttribute("href").slice(1)) : null;
    if (el && el.tagName === "DETAILS") el.open = true;
  });

  document.getElementById("tools").addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button[data-open]") : null;
    if (!btn) return;
    var open = btn.getAttribute("data-open") === "1";
    Array.prototype.forEach.call(content.querySelectorAll("details"), function (d) {
      d.open = open;
    });
  });

  // The player walks the whole page -- next, previous, and on to the next
  // track when one ends -- closed stores and tiers included. Whatever hides
  // the record it moves to is opened, once per record, so what's playing
  // is always on screen. Watched on the row's classes, which the player
  // sets when a track starts loading or playing.
  var revealedRec = null;
  new MutationObserver(function (changes) {
    for (var i = 0; i < changes.length; i++) {
      var cl = changes[i].target.classList;
      if (!cl || !((cl.contains("trow") && cl.contains("playing")) ||
                   (cl.contains("ppbtn") && cl.contains("loading")))) continue;
      var rec = changes[i].target.closest(".rec");
      if (!rec || rec === revealedRec) continue;
      revealedRec = rec;
      var opened = false;
      for (var d = rec.parentElement; d && d !== content; d = d.parentElement) {
        if (d.tagName === "DETAILS" && !d.open) { d.open = true; opened = true; }
      }
      if (opened) rec.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }).observe(content, { attributes: true, attributeFilter: ["class"], subtree: true });

  if (!DigestLikes.getToken()) hint.classList.add("show");

  content.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button.unlike") : null;
    if (!btn) return;
    if (!DigestLikes.getToken()) {
      window.open("settings.html", "_blank", "noopener");
      return;
    }
    btn.disabled = true;
    btn.textContent = "…";
    DigestLikes.unlikeItem(btn.getAttribute("data-url")).then(load).catch(function (err) {
      btn.disabled = false;
      btn.textContent = "Unlike";
      alert("Could not remove like: " + err.message);
    });
  });

  load();
})();
</script>
</body>
</html>
