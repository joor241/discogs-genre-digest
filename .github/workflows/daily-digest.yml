name: Daily Discogs digest

on:
  schedule:
    # 07:00 UTC every day = 09:00 Amsterdam in summer, 08:00 in winter.
    # Cron on GitHub Actions is ALWAYS UTC and ignores repo timezone settings.
    # Scheduled runs can be delayed by a few minutes when GitHub is busy --
    # the lookback window absorbs that.
    #
    # Keep this in step with LOOKBACK_HOURS in the script: daily + 48h means a
    # record can show up in two digests running. For fuller emails with no
    # repeats, use "0 7 */3 * *" with LOOKBACK_HOURS = 74.
    - cron: "0 7 * * *"
  workflow_dispatch:
    # These make the digest adjustable from the GitHub web UI: click
    # Actions > Daily Discogs digest > Run workflow and fill in the form.
    # Leave a field blank to use the repo variable, or the default in the script.
    inputs:
      genres:
        description: 'Genres/styles, comma separated (e.g. "techno,deep house"). Use "all" for no filter.'
        required: false
        type: string
      lookback_hours:
        description: "How many hours back to look (default 48)"
        required: false
        type: string
      dry_run:
        description: "Print the digest in the log instead of emailing it"
        required: false
        type: boolean
        default: false

# Stop a manual run and the nightly run from overlapping.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # A normal run takes well under a minute. The headroom is for the day a
    # shop bulk-lists and the run works through its full lookup budget.
    timeout-minutes: 30

    # Needed to push the generated player pages back to docs/ on main.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          # --- Secrets: Settings > Secrets and variables > Actions > Secrets ---
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          # --- Settings: Settings > Secrets and variables > Actions > Variables ---
          # Optional. Set GENRES_INCLUDE / LOOKBACK_HOURS / SELLERS there to change
          # them permanently without editing the script. A value typed into the
          # "Run workflow" form wins over the repo variable for that one run.
          GENRES_INCLUDE: ${{ inputs.genres || vars.GENRES_INCLUDE }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || vars.LOOKBACK_HOURS }}
          SELLERS: ${{ vars.SELLERS }}
          MAX_RELEASE_LOOKUPS: ${{ vars.MAX_RELEASE_LOOKUPS }}
          USER_AGENT: DiscogsGenreDigest/1.0 +https://github.com/${{ github.repository }}

          # Where the published player pages end up. The script appends
          # /archive/<date>.html to build the link it puts in the email.
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: >
          python discogs_genre_digest.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          --out digest.html
          --player-dir docs/archive

      - name: Publish the player page
        # Serving Pages from main's docs/ folder means the dated archive just
        # lives in git, so nothing extra is needed to make old pages persist.
        #
        # This runs on dry runs too, deliberately: it is the only way to test
        # the publish path without sending yourself an email. The cost is that
        # a dry run with experimental genres briefly puts an odd page on the
        # site, which the next run overwrites.
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [ ! -f "docs/archive/${today}.html" ]; then
            echo "No player page was generated - nothing to publish."
            exit 0
          fi
          # Landing page is a copy of today's, so the bare site URL is useful.
          cp "docs/archive/${today}.html" docs/index.html
          # Stop Pages running the output through Jekyll, which would drop
          # any file or folder whose name begins with an underscore.
          touch docs/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Site unchanged."
          else
            git commit -m "Publish player page for ${today}"
            # Rebase in case a manual run pushed while this one was working.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload digest preview
        # Always attach the rendered HTML so you can open it from the run page,
        # including when the job failed after building the digest.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-html
          path: digest.html
          if-no-files-found: ignore
          retention-days: 7
